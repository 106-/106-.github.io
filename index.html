<!doctype html>
<html lang="en">
  <head>
    <title>Welcome to t106.net! ^._.^</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta name="author" content="106" />
    <link href="css/main.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Halant"
      rel="stylesheet"
    />
    <link
      href="https://use.fontawesome.com/releases/v5.0.6/css/all.css"
      rel="stylesheet"
    />
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-97RE4JJMZP"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-97RE4JJMZP");
      // "t106.net" or "106-.github.io"
      gtag("event", "page_hostname", {
        hostname: window.location.hostname,
      });
    </script>

    <!-- プロフィール部分を隠すためのクエリチェック -->
    <script>
      (function () {
        var h = window.location.hostname;
        var urlParams = new URLSearchParams(window.location.search);
        document.addEventListener("DOMContentLoaded", function () {
          if (h === "106-.github.io") {
            document.title = "Welcome to 106-.github.io! ^._.^";
            document.getElementById("panel-title").textContent = h;
          }
          if (urlParams.has("noProfile")) {
            var profileSection = document.getElementById("content");
            if (profileSection) profileSection.style.display = "none";
          }
        });
      })();
    </script>
  </head>

  <body>
    <script src="js/alter.js"></script>
    <section id="content">
      <div class="h-100 d-flex align-items-center justify-content-center">
        <div class="profile-panel">
          <div class="panel-header">
            <span class="panel-title" id="panel-title">t106.net</span>
          </div>
          <div class="panel-divider">
            <p class="panel-tagline">
              Data Scientist / Machine Learning Engineer
            </p>
            <button class="toggle-btn" id="toggle-btn" onclick="toggleTab()">
              Commits
            </button>
          </div>
          <div id="tab-links" class="tab-pane">
            <a
              href="https://github.com/106-"
              class="link-item"
              target="_blank"
              rel="noopener"
              onclick="gaClick('github/106-')"
            >
              <div class="link-icon"><i class="fab fa-github"></i></div>
              <div class="link-content">
                <div class="link-title">github/106-</div>
              </div>
            </a>
            <a
              href="https://twitter.com/___106___"
              class="link-item"
              target="_blank"
              rel="noopener"
              onclick="gaClick('@___106___')"
            >
              <div class="link-icon"><i class="fab fa-twitter"></i></div>
              <div class="link-content">
                <div class="link-title">@___106___</div>
              </div>
            </a>
            <a
              href="https://www.slideshare.net/__106__"
              class="link-item"
              target="_blank"
              rel="noopener"
              onclick="gaClick('slideshare/__106__')"
            >
              <div class="link-icon"><i class="fab fa-slideshare"></i></div>
              <div class="link-content">
                <div class="link-title">slideshare/__106__</div>
              </div>
            </a>
            <a
              href="https://steamcommunity.com/profiles/76561198127476146/"
              class="link-item"
              target="_blank"
              rel="noopener"
              onclick="gaClick('Steam/__106__')"
            >
              <div class="link-icon"><i class="fab fa-steam"></i></div>
              <div class="link-content">
                <div class="link-title">Steam/__106__</div>
              </div>
            </a>
            <div class="link-item" style="cursor: default">
              <div class="link-icon"><i class="fas fa-envelope"></i></div>
              <div class="link-content">
                <div class="link-title">segmentation-fault[at]yandex.com</div>
              </div>
            </div>
          </div>
          <div id="tab-commits" class="tab-pane" style="display: none">
            <div id="commits-list">
              <div class="commit-loading">Loading...</div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script>
      var currentTab = "links";

      function toggleTab() {
        currentTab = currentTab === "links" ? "commits" : "links";
        document.getElementById("tab-links").style.display =
          currentTab === "links" ? "" : "none";
        document.getElementById("tab-commits").style.display =
          currentTab === "commits" ? "" : "none";
        document.getElementById("toggle-btn").textContent =
          currentTab === "links" ? "Commits" : "Links";
        if (
          currentTab === "commits" &&
          !document.getElementById("commits-list").dataset.loaded
        ) {
          loadCommits();
        }
      }

      function loadCommits() {
        fetch("data/commits.json")
          .then(function (r) {
            return r.json();
          })
          .then(function (commits) {
            var list = document.getElementById("commits-list");
            list.dataset.loaded = "1";
            if (!commits.length) {
              list.innerHTML =
                '<div class="commit-loading">No commits found.</div>';
              return;
            }
            list.innerHTML = commits
              .map(function (c) {
                var url = "https://github.com/" + c.repo + "/commit/" + c.sha;
                return (
                  '<a href="' +
                  url +
                  '" class="link-item link-item--compact" target="_blank" rel="noopener" onclick="gaClick(\'commit:' +
                  escapeHtml(c.repo) +
                  "')\">" +
                  '<div class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><line x1="2" y1="12" x2="7" y2="12"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><line x1="17" y1="12" x2="22" y2="12"/></svg></div>' +
                  '<div class="link-content">' +
                  '<div class="link-title commit-message">' +
                  escapeHtml(c.message) +
                  "</div>" +
                  '<div class="commit-meta">' +
                  escapeHtml(c.repo) +
                  " &middot; " +
                  c.date +
                  "</div>" +
                  "</div></a>"
                );
              })
              .join("");
          })
          .catch(function () {
            document.getElementById("commits-list").innerHTML =
              '<div class="commit-loading">Failed to load.</div>';
          });
      }

      function gaClick(label) {
        if (typeof gtag !== "undefined") {
          gtag("event", "click", {
            event_category: "outbound_link",
            event_label: label,
          });
        }
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
