name: Update commits.json

on:
  schedule:
    # 適当にピークタイムからずらしてみる
    - cron: "5 9 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch recent commits
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api "search/commits?q=author:106-+is:public&sort=committer-date&order=desc&per_page=20" \
            --header "Accept: application/vnd.github.cloak-preview+json" | \
          jq '[
            .items[]
            | select(.commit.message | startswith("Merge ") | not)
            | {
                repo: .repository.full_name,
                message: (.commit.message | split("\n") | first),
                sha: .sha,
                date: .commit.committer.date[:7]
              }
          ] | .[0:7]' > data/commits.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commits.json
          git diff --cached --quiet || git commit -m "chore: update commits.json $(date +%Y%m%d)"
          git push
